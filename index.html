<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKH Bible</title>
    <style>
        :root {
            --bg-dark: #0a192f;
            --bg-card: #172a45;
            --text-main: #e6f1ff;
            --text-muted: #8892b0;
            --accent: #64ffda;
            --accent-hover: #00b4d8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(136, 146, 176, 0.2);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
            max-width: 150px;
        }

        /* Main Content */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .verse-container {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 4px solid transparent;
            transition: border-color 0.3s ease;
        }

        .verse-container:hover {
            border-left-color: var(--accent);
        }

        .verse-header {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .verse-text {
            font-size: 1.15rem;
            line-height: 1.6;
        }

        .strong-number {
            color: var(--accent-hover);
            font-size: 0.8rem;
            vertical-align: super;
            margin-left: 2px;
            cursor: pointer;
        }

        /* Bottom Drawer for Strongs */
        #drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: var(--bg-card);
            padding: 20px;
            border-top: 1px solid var(--text-muted);
            transition: bottom 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            max-height: 40vh;
            overflow-y: auto;
            z-index: 20;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.3);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        #strong-content {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        /* Fallbacks */
        .loading, .error {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>TKH Bible</h1>
        <div class="controls">
            <select id="book-select"></select>
            <select id="chapter-select"></select>
        </div>
    </header>

    <main id="bible-content">
        <div class="loading">Loading scriptures offline...</div>
    </main>

    <div id="drawer">
        <div class="drawer-header">
            <h3>Strong's Definition</h3>
            <button class="close-btn" onclick="closeDrawer()">×</button>
        </div>
        <div id="strong-content">Click a Strong's number to view details.</div>
    </div>

    <script>
        let bibleData = null;
        let strongsData = null;
        
        // Complete 66 Books and Chapter Counts mapping
        const bookChapters = {
            "Genesis": 50, "Exodus": 40, "Leviticus": 27, "Numbers": 36, "Deuteronomy": 34,
            "Joshua": 24, "Judges": 21, "Ruth": 4, "1 Samuel": 31, "2 Samuel": 24,
            "1 Kings": 22, "2 Kings": 25, "1 Chronicles": 29, "2 Chronicles": 36, "Ezra": 10,
            "Nehemiah": 13, "Esther": 10, "Job": 42, "Psalms": 150, "Proverbs": 31,
            "Ecclesiastes": 12, "Song of Solomon": 8, "Isaiah": 66, "Jeremiah": 52, "Lamentations": 5,
            "Ezekiel": 48, "Daniel": 12, "Hosea": 14, "Joel": 3, "Amos": 9,
            "Obadiah": 1, "Jonah": 4, "Micah": 7, "Nahum": 3, "Habakkuk": 3,
            "Zephaniah": 3, "Haggai": 2, "Zechariah": 14, "Malachi": 4,
            "Matthew": 28, "Mark": 16, "Luke": 24, "John": 21, "Acts": 28,
            "Romans": 16, "1 Corinthians": 16, "2 Corinthians": 13, "Galatians": 6, "Ephesians": 6,
            "Philippians": 4, "Colossians": 4, "1 Thessalonians": 5, "2 Thessalonians": 3, "1 Timothy": 6,
            "2 Timothy": 4, "Titus": 3, "Philemon": 1, "Hebrews": 13, "James": 5,
            "1 Peter": 5, "2 Peter": 3, "1 John": 5, "2 John": 1, "3 John": 1,
            "Jude": 1, "Revelation": 22
        };

        const bookSelect = document.getElementById('book-select');
        const chapterSelect = document.getElementById('chapter-select');
        const bibleContent = document.getElementById('bible-content');
        const drawer = document.getElementById('drawer');
        const strongContent = document.getElementById('strong-content');

        // Load files locally
        async function loadData() {
            try {
                const [bibleRes, strongsRes] = await Promise.all([
                    fetch('kjv.json'),
                    fetch('kjv_strongs.json')
                ]);
                
                bibleData = await bibleRes.json();
                strongsData = await strongsRes.json();
                
                populateBooks();
                updateChapters();
            } catch (err) {
                bibleContent.innerHTML = `
                    <div class="error">
                        <strong>Offline Load Error</strong><br><br>
                        Could not load local files.<br>
                        Ensure 'kjv.json' and 'kjv_strongs.json' match your directory.
                    </div>`;
            }
        }

        function populateBooks() {
            bookSelect.innerHTML = Object.keys(bookChapters).map(book => 
                `<option value="${book}">${book}</option>`
            ).join('');
        }

        function updateChapters() {
            const selectedBook = bookSelect.value;
            const chaptersCount = bookChapters[selectedBook] || 1;
            let options = '';
            for (let i = 1; i <= chaptersCount; i++) {
                options += `<option value="${i}">Chapter ${i}</option>`;
            }
            chapterSelect.innerHTML = options;
            renderChapter();
        }

        function renderChapter() {
            const book = bookSelect.value;
            const chapter = chapterSelect.value;
            
            if (!bibleData) return;

            // Safely get verses based on dynamic book keys
            const verses = bibleData[book]?.[chapter] || [];
            
            if (verses.length === 0) {
                bibleContent.innerHTML = `<div class="loading">No verse text found for ${book} ${chapter}. Check your JSON keys matches exactly.</div>`;
                return;
            }

            bibleContent.innerHTML = verses.map((verseText, index) => {
                let formattedText = verseText;

                // Strong's matching fallback helper 
                // Parses numbers matching formats like {H1234} or {G5678}
                if (strongsData) {
                    formattedText = verseText.replace(/\{([HG]\d+)\}/g, (match, strongNum) => {
                        return `<span class="strong-number" onclick="openStrong('${strongNum}')">[${strongNum}]</span>`;
                    });
                }

                return `
                    <div class="verse-container">
                        <div class="verse-header">
                            <span>${book} ${chapter}:${index + 1}</span>
                        </div>
                        <div class="verse-text">${formattedText}</div>
                    </div>
                `;
            }).join('');
            
            // Auto scroll to top of chapter when changed
            bibleContent.scrollTop = 0;
        }

        function openStrong(strongId) {
            const definition = strongsData[strongId] || "Definition not found in your strongs schema.";
            strongContent.innerHTML = `<strong>${strongId}</strong>:<br>${definition}`;
            drawer.style.bottom = "0";
        }

        function closeDrawer() {
            drawer.style.bottom = "-100%";
        }

                // Action Listeners
        bookSelect.addEventListener('change', () => {
            updateChapters();
        });
        chapterSelect.addEventListener('change', renderChapter);

        // Run
        loadData();
    </script>
</body>
</html>
