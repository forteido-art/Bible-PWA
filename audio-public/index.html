<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastor Julius - Media</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">
<style>
  :root { --blue: #0d47a1; --blue2: #1976d2; }
    * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    color: white; min-height: 100vh; padding-bottom: 80px;
  }
  header {
    padding: 20px; text-align: center; position: sticky; top: 0;
    background: rgba(13,71,161,0.95); backdrop-filter: blur(10px); z-index: 10;
  }
  header img { width: 60px; height: 60px; border-radius: 16px; }
  h1 { margin: 8px 0 0; font-size: 22px; }
  
  .search-box {
    padding: 12px 16px; background: rgba(255,255,255,0.2);
    border: none; border-radius: 12px; width: 90%; max-width: 400px;
    color: white; font-size: 16px; margin-top: 12px; outline: none;
  }
  .search-box::placeholder { color: rgba(255,255,255,0.7); }

  .tabs { display: flex; background: rgba(0,0,0,0.2); }
  .tab {
    flex: 1; padding: 14px; border: none; background: none; color: white;
    font-size: 16px; font-weight: 600; cursor: pointer; opacity: 0.6;
  }
  .tab.active { opacity: 1; border-bottom: 3px solid white; }
  .content { padding: 16px; }
  .item {
    background: rgba(255,255,255,0.12); border-radius: 16px; padding: 14px;
    margin-bottom: 14px; backdrop-filter: blur(8px);
  }
  .item h3 { margin: 0 0 8px; font-size: 15px; line-height: 1.4; }
  .item p { margin: 0 0 10px; font-size: 12px; opacity: 0.8; }
  audio { width: 100%; border-radius: 10px; margin-bottom: 10px; }
  
  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 10px; background: white; color: var(--blue);
    border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px;
    border: none; cursor: pointer; text-align: center;
  }
  .btn.download { background: rgba(255,255,255,0.2); color: white; }
  .loader { text-align: center; padding: 40px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <img src="/logo.png" alt="logo">
    <h1>Pastor Julius</h1>
    <p style="margin:4px 0 0; font-size:14px; opacity:0.8">The King's Household Church</p>
    <input type="text" class="search-box" id="search" placeholder="Search sermons & books...">
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('audio')">Audio</button>
    <button class="tab" onclick="showTab('books')">Books</button>
  </div>

  <div class="content">
    <div id="audio" class="tab-content"></div>
    <div id="books" class="tab-content" style="display:none"></div>
  </div>

<script>
const ARCHIVE_USER = "pastor_julius";
let allItems = [], audioData = [], bookData = [];

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelector(`.tab[onclick="showTab('${tab}')"]`).classList.add('active');
  document.getElementById(tab).style.display = 'block';
}

// Download function
function downloadFile(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Search function
document.getElementById('search').addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase();
  const filtered = allItems.filter(i => 
    (i.title || '').toLowerCase().includes(term) || 
    (i.description || '').toLowerCase().includes(term)
  );
  audioData = filtered.filter(i => i.mediatype === 'audio');
  bookData = filtered.filter(i => i.mediatype === 'texts');
  renderAudio();
  renderBooks();
});

// Fetch from Archive.org API
async function loadItems() {
  document.getElementById('audio').innerHTML = '<div class="loader">Loading audio...</div>';
  document.getElementById('books').innerHTML = '<div class="loader">Loading books...</div>';

  const url = `https://archive.org/advancedsearch.php?q=creator:"${ARCHIVE_USER}"&fl[]=identifier,title,description,date,mediatype&rows=100&page=1&output=json`;
  const res = await fetch(url);
  const data = await res.json();
  allItems = data.response.docs;

  audioData = allItems.filter(i => i.mediatype === 'audio');
  bookData = allItems.filter(i => i.mediatype === 'texts');

  renderAudio();
  renderBooks();
}

function renderAudio() {
  const container = document.getElementById('audio');
  if(audioData.length === 0) { container.innerHTML = '<p>No audio found</p>'; return; }
  
  container.innerHTML = audioData.map(item => {
    const audioUrl = `https://archive.org/download/${item.identifier}/${item.identifier}_64kb.mp3`;
    return `
    <div class="item">
      <h3>${item.title || item.identifier}</h3>
      <p>${item.date || ''}</p>
      <audio controls preload="metadata" src="${audioUrl}"></audio>
      <div class="btn-row">
        <button class="btn" onclick="downloadFile('${audioUrl}', '${item.title}.mp3')">Download</button>
        <a class="btn download" target="_blank" href="https://archive.org/details/${item.identifier}">Details</a>
      </div>
    </div>
  `}).join('');
}

function renderBooks() {
  const container = document.getElementById('books');
  if(bookData.length === 0) { container.innerHTML = '<p>No books found</p>'; return; }
  
  container.innerHTML = bookData.map(item => `
    <div class="item">
      <h3>${item.title || item.identifier}</h3>
      <p>${item.description ? item.description.substring(0,120)+'...' : ''}</p>
      <div class="btn-row">
        <a class="btn" target="_blank" href="https://archive.org/embed/${item.identifier}">Read Online</a>
        <a class="btn download" target="_blank" href="https://archive.org/download/${item.identifier}/${item.identifier}.pdf">Download PDF</a>
      </div>
    </div>
  `).join('');
}

loadItems();
</script>
</body>
</html>
