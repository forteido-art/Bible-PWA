<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Holy Bible KJV</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #0f172a;
  --bg-elev: #1e293b;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --accent: #38bdf8;
  --highlight: #facc15;
  --red: #ef4444;
  --border: #334155;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff;
    --bg-elev: #f8fafc;
    --text: #0f172a;
    --text-dim: #475569;
    --accent: #0284c7;
    --highlight: #fef08a;
    --red: #dc2626;
    --border: #e2e8f0;
  }
}

* { 
  box-sizing: border-box; 
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  overflow-x: hidden; /* stops horizontal scroll */
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
  line-height: 1.8;
  font-size: 18px;
  padding-bottom: 80px; /* space for bottom nav */
}

/* HEADER WITH LOGO */
header {
  position: sticky; 
  top: 0; 
  z-index: 100;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
  width: 100%;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
header img {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
}
header h1 {
  margin: 0;
  font-size: 20px;
  color: var(--text);
  font-family: sans-serif;
}

/* TOOLBAR - THIS WAS THE MAIN ISSUE */
.toolbar {
  display: flex; 
  gap: 8px; 
  padding: 12px; 
  align-items: center;
  overflow-x: auto; /* allows sideways scroll */
  white-space: nowrap;
  width: 100%;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.toolbar::-webkit-scrollbar { display: none; } /* hide scroll bar */
.toolbar select, .toolbar button {
  flex-shrink: 0; /* prevents squishing */
  padding: 10px 14px;
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  min-height: 42px;
}

/* BIBLE TEXT */
.bible-text {
  padding: 16px;
  max-width: 800px;
  margin: 0 auto;
}
.verse {
  margin-bottom: 12px;
}

/* POPUP / MODAL - FIXES THE SPILL */
.popup, .modal {
  width: 92vw; /* 92% of screen width */
  max-width: 500px;
  margin: 20px auto;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.popup h3 {
  margin-bottom: 12px;
  color: var(--accent);
}
.popup button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
}
.popup button.danger {
  background: var(--red);
  color: #fff;
}

/* MOBILE TWEAKS */
@media (max-width: 600px) {
  body { font-size: 17px; }
  header h1 { font-size: 18px; }
  .toolbar { padding: 8px; gap: 6px; }
  .toolbar select, .toolbar button { padding: 8px 10px; font-size: 14px; }
  .bible-text { padding: 12px; }
}
</style>
</head>
<body>
<header style="display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid #333; background:#111; position:sticky; top:0; z-index:10;">
  <img src="logo.png" alt="Bible Logo" style="width:42px; height:42px; border-radius:12px; object-fit:cover;">
  <h1 style="margin:0; font-size:20px; color:#fff; font-family:sans-serif;">Holy Bible KJV</h1>
</header>
  <header>
    <div class="toolbar">
      <button class="nav-btn" id="prev-ch">‹</button>
      <select id="book-select"></select>
      <select id="chapter-select"></select>
      <select id="verse-select"></select>
      <button class="nav-btn" id="next-ch">›</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search Scripture...">
      <div id="search-results"></div>
    </div>
  </header>
  <main>
    <h1 id="current-ref"></h1>
    <div id="verses"></div>
  </main>

  <button class="fab" id="menu-btn" title="Menu">⋮</button>

  <div class="modal" id="verse-modal">
    <div class="modal-content">
      <h3 id="modal-ref"></h3>
      <button id="btn-highlight">Toggle Highlight</button>
      <textarea id="note-input" placeholder="Add a note..."></textarea>
      <button id="btn-save-note">Save Note</button>
      <button class="secondary" id="btn-close-modal">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
