<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TKH Bible</title>
    
    <style>
        :root {
            --bg-dark-blue: #0B1528;
            --bg-surface: #13223C;
            --text-primary: #E2E8F0;
            --text-muted: #94A3B8;
            --accent-gold: #F59E0B;
            --border-color: #1E293B;
            --font-reading: 'Georgia', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark-blue);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header {
            background-color: var(--bg-surface);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .app-header h1 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px;
        }

        .reading-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 84px 20px;
            scroll-behavior: smooth;
        }

        .bible-text-area {
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .verse-row {
            margin-bottom: 18px;
            font-family: var(--font-reading);
            font-size: 1.2rem;
            text-align: left;
        }

        .verse-num {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-gold);
            vertical-align: super;
            margin-right: 8px;
            user-select: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 10;
        }

        .nav-arrow {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-center {
            background-color: var(--border-color);
            color: var(--text-primary);
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            max-width: 50%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(7, 13, 24, 0.96);
            z-index: 100;
            display: flex;
            justify-content: center;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .search-header {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }

        #search-input {
            flex: 1;
            background-color: var(--bg-dark-blue);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            padding: 0 8px;
            cursor: pointer;
        }

        .results-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .search-item {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .search-item-title {
            color: var(--accent-gold);
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .search-item-text {
            font-family: var(--font-reading);
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .text-center { text-align: center; }
        .modal-content h3 { margin-bottom: 16px; font-weight: 600;}
        
        .picker-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 20px 0;
        }

        select {
            width: 100%;
            background-color: var(--bg-dark-blue);
            color: var(--text-primary);
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .primary-btn {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div style="width: 32px;"></div>
        <h1 id="current-title">Loading...</h1>
        <button id="search-trigger" class="icon-btn">🔍</button>
    </header>

    <!-- Reading Window Pane -->
    <main class="reading-container">
        <div id="bible-viewer" class="bible-text-area"></div>
    </main>

    <!-- Footer Controller System -->
    <nav class="bottom-nav">
        <button id="prev-chap" class="nav-arrow">◀ Prev</button>
        <button id="picker-trigger" class="nav-center">Select Book</button>
        <button id="next-chap" class="nav-arrow">Next ▶</button>
    </nav>

    <!-- Interactive Query Search Dropdown -->
    <div id="search-modal" class="modal hidden">
        <div class="modal-content">
            <div class="search-header">
                <input type="text" id="search-input" placeholder="Type keyword to search offline..." autocomplete="off">
                <button id="close-search" class="close-btn">✕</button>
            </div>
            <div id="search-results" class="results-container"></div>
        </div>
    </div>

    <!-- Chapter Layout Selectors -->
    <div id="picker-modal" class="modal hidden">
        <div class="modal-content text-center">
            <h3>Jump to Scripture</h3>
            <div class="picker-grid">
                <select id="book-select"></select>
                <select id="chapter-select"></select>
            </div>
            <button id="apply-picker" class="primary-btn">Open Chapter</button>
        </div>
    </div>

    <!-- MAIN CONTROL JAVASCRIPT ENGINE -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let rawBibleData = null;
            let bookKeys = [];
            let currentBookIdx = 0;
            let currentChapterIdx = 0;

            // Interface Cache Selectors
            const viewer = document.getElementById("bible-viewer");
            const currentTitle = document.getElementById("current-title");
            const prevBtn = document.getElementById("prev-chap");
            const nextBtn = document.getElementById("next-chap");
            
            const searchModal = document.getElementById("search-modal");
            const searchTrigger = document.getElementById("search-trigger");
            const closeSearch = document.getElementById("close-search");
            const searchInput = document.getElementById("search-input");
            const searchResults = document.getElementById("search-results");

            const pickerModal = document.getElementById("picker-modal");
            const pickerTrigger = document.getElementById("picker-trigger");
            const bookSelect = document.getElementById("book-select");
            const chapterSelect = document.getElementById("chapter-select");
            const applyPicker = document.getElementById("apply-picker");

            // ASYNC FETCH LOADER ENGINE
            async function loadBibleJSON() {
                try {
                    // Fetches local file instantly (Perfect for Offline Server environments & Vercel setups)
                    const response = await fetch('kjv.json');
                    if (!response.ok) throw new Error("Failed to load JSON file");
                    
                    let data = await response.json();
                    
                    // Unwraps data safely if the JSON has a root key like "books"
                    if (data && data.books) data = data.books;
                    if (data && data.bible) data = data.bible;                   
rawBibleData = data;
bookKeys = Object.keys(rawBibleData);
// Initialize system
initSelectors();
renderChapter();
} catch (error) {
console.error(error);
viewer.innerHTML = <div class="text-center" style="padding-top:40px; color:red;"> Error loading kjv.json.<br>Verify file is in the same folder and casing is correct. </div>;
}
}
function getSortedChapters(bookName) {
return Object.keys(rawBibleData[bookName]).sort((a, b) => parseInt(a) - parseInt(b));
}
function getSortedVerses(bookName, chapterKey) {
return Object.keys(rawBibleData[bookName][chapterKey]).sort((a, b) => parseInt(a) - parseInt(b));
}
// 1. Text Rendering Framework
function renderChapter() {
if (!rawBibleData) return;
const bookName = bookKeys[currentBookIdx];
const chaptersList = getSortedChapters(bookName);
const targetChapterKey = chaptersList[currentChapterIdx];
currentTitle.textContent = ${bookName} ${targetChapterKey};
pickerTrigger.textContent = ${bookName} ${targetChapterKey};
const chapterObject = rawBibleData[bookName][targetChapterKey];
const versesList = getSortedVerses(bookName, targetChapterKey);
let htmlOutput = "";
for (let i = 0; i < versesList.length; i++) {
const verseNum = versesList[i];
const verseText = chapterObject[verseNum];
htmlOutput += <div class="verse-row"> <span class="verse-num">${verseNum}</span>${verseText} </div>;
}
viewer.innerHTML = htmlOutput;
document.querySelector('.reading-container').scrollTop = 0;
}
// 2. Navigation Control Pipeline
function navigate(direction) {
if (!rawBibleData) return;
const bookName = bookKeys[currentBookIdx];
const chaptersList = getSortedChapters(bookName);
if (direction === 1) {
if (currentChapterIdx < chaptersList.length - 1) {
currentChapterIdx++;
} else if (currentBookIdx < bookKeys.length - 1) {
currentBookIdx++;
currentChapterIdx = 0;
}
} else {
if (currentChapterIdx > 0) {
currentChapterIdx--;
} else if (currentBookIdx > 0) {
currentBookIdx--;
const prevBookName = bookKeys[currentBookIdx];
currentChapterIdx = getSortedChapters(prevBookName).length - 1;
}
}
renderChapter();
}
// 3. Optimized Offline Content Search Algorithm
function runSearch(query) {
searchResults.innerHTML = "";
const cleanQuery = query.toLowerCase().trim();
if (cleanQuery.length < 2) return;
let matches = 0;
const fragment = document.createDocumentFragment();
for (let b = 0; b < bookKeys.length; b++) {
const bName = bookKeys[b];
const chKeys = Object.keys(rawBibleData[bName]);
for (let c = 0; c < chKeys.length; c++) {
const cKey = chKeys[c];
const vObject = rawBibleData[bName][cKey];
const vKeys = Object.keys(vObject);
for (let v = 0; v < vKeys.length; v++) {
const vKey = vKeys[v];
const text = vObject[vKey];
if (text.toLowerCase().includes(cleanQuery)) {
matches++;
const row = document.createElement("div");
row.className = "search-item";
row.innerHTML = <div class="search-item-title">${bName} ${cKey}:${vKey}</div> <div class="search-item-text">${text}</div>;
const targetBookIdx = b;
const targetChList = getSortedChapters(bName);
const targetChIdx = targetChList.indexOf(cKey);
row.onclick = () => {
currentBookIdx = targetBookIdx;
currentChapterIdx = targetChIdx;
renderChapter();
searchModal.classList.add("hidden");
searchInput.value = "";
};
fragment.appendChild(row);
if (matches >= 80) break;
}
}
if (matches >= 80) break;
}
if (matches >= 80) break;
}
if (matches === 0) {
searchResults.innerHTML = <div class="search-item text-center">No matching scriptures found.</div>;
} else {
searchResults.appendChild(fragment);
}
}
// 4. Modal Picklists Initializer
function initSelectors() {
bookSelect.innerHTML = bookKeys.map((name, i) => <option value="${i}">${name}</option>).join('');
syncChaptersDropdown();
bookSelect.addEventListener("change", syncChaptersDropdown);
}
function syncChaptersDropdown() {
const chosenBookName = bookKeys[bookSelect.value];
const chaptersList = getSortedChapters(chosenBookName);
chapterSelect.innerHTML = chaptersList.map((chKey, i) => <option value="${i}">Chapter ${chKey}</option>).join('');
}
// 5. Native Interface Event Hookups
prevBtn.addEventListener("click", () => navigate(-1));
nextBtn.addEventListener("click", () => navigate(1));
searchTrigger.addEventListener("click", () => {
searchModal.classList.remove("hidden");
searchInput.focus();
});
closeSearch.addEventListener("click", () => {
searchModal.classList.add("hidden");
searchInput.value = "";
});
searchInput.addEventListener("input", (e) => runSearch(e.target.value));
pickerTrigger.addEventListener("click", () => {
if (!rawBibleData) return;
bookSelect.value = currentBookIdx;
syncChaptersDropdown();
chapterSelect.value = currentChapterIdx;
pickerModal.classList.remove("hidden");
});
applyPicker.addEventListener("click", () => {
currentBookIdx = parseInt(bookSelect.value);
currentChapterIdx = parseInt(chapterSelect.value);
renderChapter();
pickerModal.classList.add("hidden");
});
window.onclick = (e) => {
if (e.target === searchModal) searchModal.classList.add("hidden");
if (e.target === pickerModal) pickerModal.classList.add("hidden");
};
// Bootstrap Execute Operation
loadBibleJSON();
});
